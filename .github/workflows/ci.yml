name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crewboard
          POSTGRES_PASSWORD: crewboard
          POSTGRES_DB: crewboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crewboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://crewboard:crewboard@localhost:5432/crewboard
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      WEBHOOK_SECRET: ci-webhook-secret-at-least-32-characters

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up --build -d
          for i in $(seq 1 90); do curl -fs http://localhost:5173/health && break || sleep 2; done
      - name: Install Playwright
        working-directory: frontend
        run: |
          # docker compose creates a root-owned node_modules mount point on the host
          sudo chown -R "$USER":"$USER" .
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e
        working-directory: frontend
        run: npx playwright test
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
