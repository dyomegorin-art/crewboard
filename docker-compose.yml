x-app: &app
  build:
    context: ./backend
    args:
      BASE_IMAGE: ${BACKEND_BASE_IMAGE:-python:3.12-slim}
  env_file: .env
  volumes:
    - ./backend:/srv
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    # миграции и seed применяются при старте api; воркер ждёт его healthcheck
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 40

  worker:
    <<: *app
    command: arq app.worker.WorkerSettings
    depends_on:
      api:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: crewboard
      POSTGRES_PASSWORD: crewboard
      POSTGRES_DB: crewboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crewboard"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  pgdata:
  web_node_modules:
